<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Illia Karmazin (53819) - AI LAB C</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="styles.css">

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        defer
    ></script>

    <script
        src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"
        defer
    ></script>

    <script src="scripts.js" defer></script>
</head>
<body>
<!-- Kod wygenerowany przy użyciu Cursor AI -->
<main class="container">
    <header class="header">
        <h1>Mapa Puzzle</h1>
        <p>AI LAB C – Zaawansowane JS w przeglądarce</p>
    </header>

    <section class="panel">
        <h2>Mapa interaktywna</h2>

        <div class="toolbar">
            <button id="locationBtn" type="button">
                Moja lokalizacja
            </button>

            <button id="downloadBtn" type="button">
                Pobierz mapę
            </button>
        </div>

        <p id="coordinates">
            Współrzędne: nie pobrano
        </p>

        <div id="map"></div>

        <p id="status" role="status" aria-live="polite">
            Mapa gotowa.
        </p>
    </section>

    <section class="panel">
        <h2>Obraz mapy zapisany w Canvas</h2>

        <canvas id="mapCanvas"></canvas>
    </section>

    <section class="panel">
        <h2>Układanka – 16 elementów</h2>

        <div class="puzzle-layout">
            <div class="puzzle-section">
                <h3>Rozsypane puzzle</h3>
                <div id="piecesContainer" class="puzzle-grid"></div>
            </div>

            <div class="puzzle-section">
                <h3>Miejsce do układania</h3>
                <div id="board" class="puzzle-grid"></div>
            </div>
        </div>

        <p id="puzzleStatus">
            Najpierw pobierz mapę, aby rozpocząć grę.
        </p>
    </section>
</main>
</body>
</html>
